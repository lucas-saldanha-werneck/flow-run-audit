[project]
name = "flow-run-audit"
version = "0.1.0"
description = "Audit exported automation run logs for duplicate runs, silent failures, retry storms, stuck runs and PII in logs."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
flow-run-audit = "flow_run_audit.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flow_run_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
